services:
  - type: web
    name: sahaya-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/app.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MOCK_WEATHER_ALERTS
        value: "false"

